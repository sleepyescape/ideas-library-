# Плагин загрузили через сайт GitHub в папку plugins/ — копии в .claude/
# и маркетплейс пересоберутся сами, ничего запускать не нужно.
name: Sync plugins

on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/plugins.py sync
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .claude-plugin .claude
          git diff --cached --quiet || { git commit -m "Sync plugin marketplace" && git push; }
